name: Docs Publish

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            biber \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-science \
            texlive-lang-spanish

      - name: Build Report PDF
        run: |
          # Two pdflatex passes around biber so bibliography and cross-references resolve.
          # Non-zero exits are tolerated (undefined refs on the first pass, PDF/A
          # warnings from pdfx); the `test -f` below is the real success check.
          pdflatex -interaction=nonstopmode -file-line-error -output-directory=docs/report docs/report/report.tex || true
          biber ./docs/report/report || true
          pdflatex -interaction=nonstopmode -file-line-error -output-directory=docs/report docs/report/report.tex || true
          test -f docs/report/report.pdf

      - name: Bundle Presentation
        run: cp ppt/output.html docs/presentation.html

      - name: Deploy Docs
        run: uv run mkdocs gh-deploy --force
